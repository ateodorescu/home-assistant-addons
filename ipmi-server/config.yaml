---
name: "IPMItool server"
version: "2.7.0"
slug: "ipmi-server"
description: "IPMItool server"
url: "https://github.com/ateodorescu/home-assistant-addons"
arch:
  - aarch64
  - amd64

panel_icon: "mdi:server"
init: false
hassio_api: true
host_network: true
ingress: true
ingress_stream: true
ingress_entry: ui

options:
  log_level: "info"

schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

ports:
  # App listens on 9595. With host_network this is the real host port (no remap).
  9595/tcp: 9595

ports_description:
  9595/tcp: "Web UI / API (also available via Ingress)"

# For published releases, set this so Supervisor pulls the prebuilt image.
# For local Dockerfile builds/testing, comment it out.
image: "ghcr.io/ateodorescu/ipmi-server/{arch}"

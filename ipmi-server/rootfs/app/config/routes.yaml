# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

app_web_ui:
  path: /ui
  controller: App\Controller\WebUiController::index
  methods: [GET, POST]

app_ipmi:
  path: /
  controller: App\Controller\IpmiController::index

app_command:
  path: /command
  controller: App\Controller\IpmiController::command

app_ipmi_sensors:
  path: /sensors
  controller: App\Controller\IpmiController::sensors

app_ipmi_on:
  path: /power_on
  controller: App\Controller\IpmiController::power_on

app_ipmi_off:
  path: /power_off
  controller: App\Controller\IpmiController::power_off

app_ipmi_cycle:
  path: /power_cycle
  controller: App\Controller\IpmiController::power_cycle

app_ipmi_reset:
  path: /power_reset
  controller: App\Controller\IpmiController::power_reset

app_ipmi_shutdown:
  path: /soft_shutdown
  controller: App\Controller\IpmiController::soft_shutdown

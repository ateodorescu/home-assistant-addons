[www]
user = nginx
group = nginx

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 50
pm.start_servers = 20
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1024
;pm.status_path = /status

; Never log request URIs (they may contain secrets) to the add-on log stream.
access.log = /dev/null

clear_env = no
; Older BMC cipher suites (e.g. -C 3) need OpenSSL 3 legacy provider.
env[OPENSSL_CONF] = /etc/ssl/ipmitool-openssl.cnf
php_admin_value[error_log] = /app/var/log/php-error.log
php_admin_flag[log_errors] = on
; Allow auto-detect across interfaces; keep in sync with nginx fastcgi_read_timeout.
request_terminate_timeout = 120

server {
    # With host_network, Supervisor port mappings are not applied — listen on
    # 9595 directly so HOME_ASSISTANT_IP:9595 and the integration default work.
    listen 9595 default_server;
    listen [::]:9595 default_server;

    root /app/public;
    index index.php;

    # Make site accessible from http://localhost/
    server_name _;

    # Home Assistant Ingress can produce paths like "//ui" when joining entrypoints.
    # Quote the regex: unquoted `{2,}` is parsed as an nginx block.
    rewrite "^/{2,}(.*)$" /$1 permanent;

    # Reduce noisy FastCGI stderr lines in the add-on log (they include full request URIs).
    # PHP application errors go to /app/var/log/php-error.log instead.
    error_log /proc/1/fd/1 warn;

    # Sensor auto-detect may try several interfaces (COMMAND_TIMEOUT each).
    # Keep above PHP's request_terminate_timeout / ipmitool budget.
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;

    location / {
        # try_files $uri $uri/ =404;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # optionally set the value of the environment variables used in the application
        # fastcgi_param APP_ENV prod;
        # fastcgi_param APP_SECRET <app-secret-id>;
        # fastcgi_param DATABASE_URL "mysql://db_user:db_pass@host:3306/db_name";

        # When you are using symlinks to link the document root to the
        # current version of your application, you should pass the real
        # application path instead of the path to the symlink to PHP
        # FPM.
        # Otherwise, PHP's OPcache may not properly detect changes to
        # your PHP files (see https://github.com/zendtech/ZendOptimizerPlus/issues/126
        # for more information).
        # Caveat: When PHP-FPM is hosted on a different machine from nginx
        #         $realpath_root may not resolve as you expect! In this case try using
        #         $document_root instead.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;

    }
    
    location ~ \.php$ {
        return 404;
    }

    # location /api {
    #     rewrite ^/api/?$ /index.php?page=newznabapi last;
    # }

    error_page 404 /404.html;

    # pass the PHP scripts to FastCGI server listening on socket
    #
    # location ~ \.php$ {
    #     try_files $uri =404;
    #     fastcgi_buffers 32 4k;
    #     fastcgi_split_path_info ^(.+\.php)(/.+)$;
    #     fastcgi_pass unix:/run/php-fpm.sock;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    #     fastcgi_param HTTPS $fastcgi_https;
    #     fastcgi_index index.php;
    #     include fastcgi_params;
    # }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml)$ {
        expires 5d;
    }

    # deny access to . files, for security
    #
    location ~ /\. {
        log_not_found off;
        deny all;
    }
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/public;
    index index.php;

    server_name _;

    # Home Assistant Ingress-style paths are not used here, but keep the rewrite
    # so behaviour matches the add-on when URLs contain duplicate slashes.
    rewrite "^/{2,}(.*)$" /$1 permanent;

    # Sensor auto-detect may try several interfaces (COMMAND_TIMEOUT each).
    # Keep above PHP's request_terminate_timeout / ipmitool budget.
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml)$ {
        expires 5d;
    }

    location ~ /\. {
        log_not_found off;
        deny all;
    }
}

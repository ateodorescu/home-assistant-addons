[global]
daemonize = no

[www]
; Unix socket (same as the Home Assistant add-on). Avoids TCP 9000.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = nginx
listen.mode = 0660

; Never log request URIs (they may contain secrets).
access.log = /dev/null

clear_env = no
; Older BMC cipher suites (e.g. -C 3) need OpenSSL 3 legacy provider.
env[OPENSSL_CONF] = /etc/ssl/ipmitool-openssl.cnf
php_admin_value[error_log] = /var/www/html/var/log/php-error.log
php_admin_flag[log_errors] = on
; Allow auto-detect across interfaces; keep in sync with nginx fastcgi_read_timeout.
request_terminate_timeout = 120
; Do not write core dumps into the document root (or anywhere) on worker crashes.
rlimit_core = 0
; Keep worker cwd out of nginx root so any host-level core pattern still misses public/.
chdir = /var/www/html
